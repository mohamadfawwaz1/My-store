<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ميني ماركت الحقل</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Lalezar&display=swap">
<style>
:root {
  /* Layout: shop counter. Sign-style header, shelf-label category tabs, product tiles with price tags, receipt-style order bar at the bottom. */
  --bg: #F0F4EC;
  --surface: #FFFFFF;
  --ink: #14281D;
  --muted: #5A6D60;
  --line: #D6E0D2;
  --brand: #1B6B47;
  --brand-ink: #FFFFFF;
  --head-bg: #1B6B47;
  --head-ink: #FFFFFF;
  --tag: #FFC93C;
  --tag-ink: #2A2000;
  --tile: #E4EDDF;
  --wa: #157A3F;
  --wa-ink: #FFFFFF;
  --danger: #B3261E;
  --display: 'Lalezar', 'Tajawal', Tahoma, sans-serif;
  --body: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1912;
    --surface: #16261C;
    --ink: #E6EFE8;
    --muted: #9FB4A5;
    --line: #264030;
    --brand: #5CC893;
    --brand-ink: #06210F;
    --head-bg: #12382A;
    --head-ink: #E9F6EE;
    --tag: #FFC93C;
    --tag-ink: #2A2000;
    --tile: #1F3427;
    --wa: #2BBE67;
    --wa-ink: #04210F;
    --danger: #FF8F86;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1912;
  --surface: #16261C;
  --ink: #E6EFE8;
  --muted: #9FB4A5;
  --line: #264030;
  --brand: #5CC893;
  --brand-ink: #06210F;
  --head-bg: #12382A;
  --head-ink: #E9F6EE;
  --tag: #FFC93C;
  --tag-ink: #2A2000;
  --tile: #1F3427;
  --wa: #2BBE67;
  --wa-ink: #04210F;
  --danger: #FF8F86;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.5;
  direction: rtl;
}
body.lock { overflow: hidden; }
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 30;
  background: var(--bg);
}
button, input, textarea { font-family: inherit; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap {
  max-width: 880px;
  margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* price tag */
.price {
  --hole: var(--surface);
  display: inline-flex;
  align-items: baseline;
  gap: 4px;
  padding: 3px 10px 3px 14px;
  background: radial-gradient(circle at 11px 50%, var(--hole) 0 2.2px, transparent 2.7px), var(--tag);
  color: var(--tag-ink);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  clip-path: polygon(0 50%, 9px 0, 100% 0, 100% 100%, 9px 100%);
  border-radius: 0 4px 4px 0;
}
.price small { font-size: 0.78em; font-weight: 600; }

/* header */
.head { background: var(--head-bg); color: var(--head-ink); }
.head__in {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  padding-block: 20px 22px;
}
.head h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 400;
  font-size: 38px;
  line-height: 1.1;
}
.head p { margin: 4px 0 0; font-size: 14px; opacity: 0.9; }
.head .price { --hole: var(--head-bg); font-size: 13px; }

/* search + categories */
.stick {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 15;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.stick .wrap { padding-block: 12px 0; }
.search {
  width: 100%;
  height: 46px;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  color: var(--ink);
  font-size: 16px;
}
.search::placeholder { color: var(--muted); }
.chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-block: 10px;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none;
  min-height: 40px;
  padding: 6px 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  color: var(--ink);
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
}
.chip[aria-pressed="true"] {
  background: var(--brand);
  border-color: var(--brand);
  color: var(--brand-ink);
  font-weight: 600;
}

/* products */
#products { padding-block: 4px 130px; min-height: 60vh; }
.group h2 {
  margin: 22px 0 10px;
  font-family: var(--display);
  font-weight: 400;
  font-size: 25px;
  line-height: 1.2;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 12px;
}
.card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
}
.thumb {
  display: grid;
  place-items: center;
  height: 92px;
  background: var(--tile);
  font-size: 46px;
  line-height: 1;
}
.card__body {
  display: flex;
  flex: 1;
  flex-direction: column;
  gap: 2px;
  padding: 10px 12px 12px;
}
.card h3 {
  margin: 0;
  font-size: 15px;
  font-weight: 600;
  line-height: 1.35;
  text-wrap: balance;
}
.unit { margin: 0; font-size: 13px; color: var(--muted); }
.card__foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: auto;
  padding-top: 10px;
}
.ctl { display: flex; }
.add {
  min-height: 38px;
  padding: 0 14px;
  border: 0;
  border-radius: 10px;
  background: var(--brand);
  color: var(--brand-ink);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}
.step {
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--bg);
}
.step button {
  width: 36px;
  height: 36px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: var(--ink);
  font-size: 20px;
  line-height: 1;
  cursor: pointer;
}
.step button[data-act="inc"] { background: var(--brand); color: var(--brand-ink); }
.step output {
  min-width: 28px;
  text-align: center;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.empty { padding: 40px 0; text-align: center; color: var(--muted); }

/* order bar */
.bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  padding-top: 14px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(to top, var(--bg) 65%, transparent);
}
.bar__btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  width: 100%;
  max-width: 560px;
  margin-inline: auto;
  padding: 12px 14px;
  border: 0;
  border-radius: 14px;
  background: var(--brand);
  color: var(--brand-ink);
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
}
.bar__l { display: inline-flex; align-items: center; gap: 10px; }
.badge {
  display: inline-grid;
  place-items: center;
  min-width: 28px;
  height: 28px;
  padding: 0 6px;
  border-radius: 14px;
  background: var(--brand-ink);
  color: var(--brand);
  font-size: 14px;
  font-variant-numeric: tabular-nums;
}
.bar .price { --hole: var(--brand); font-size: 16px; }

/* cart sheet */
.sheet {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.sheet__back { position: absolute; inset: 0; background: rgba(6, 14, 9, 0.6); }
.sheet__panel {
  position: relative;
  width: 100%;
  max-width: 560px;
  max-height: 92dvh;
  overflow-y: auto;
  background: var(--surface);
  border-radius: 20px 20px 0 0;
  padding-top: 16px;
  padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-reduced-motion: no-preference) {
  .sheet__panel { animation: rise 0.22s ease-out; }
  @keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
}
.sheet__top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sheet__top h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 26px; }
.x {
  width: 40px;
  height: 40px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--bg);
  color: var(--ink);
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
}
.lines { list-style: none; margin: 12px 0 0; padding: 0; }
.line {
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  padding-block: 10px;
  border-bottom: 1px solid var(--line);
}
.line__ico {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: 10px;
  background: var(--tile);
  font-size: 26px;
}
.line__info { display: flex; flex-direction: column; min-width: 0; }
.line__info strong { font-weight: 600; }
.line__info span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.line__end { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.line__sum { font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
.total {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-block: 14px 6px;
  font-size: 17px;
  font-weight: 700;
}
.total .price { font-size: 19px; }
.form { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.lbl { font-size: 14px; font-weight: 600; }
.lbl em { color: var(--muted); font-style: normal; font-weight: 400; }
.in {
  width: 100%;
  min-height: 46px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--bg);
  color: var(--ink);
  font-size: 16px;
}
textarea.in { resize: vertical; min-height: 70px; }
.in[aria-invalid="true"] { border-color: var(--danger); }
fieldset.seg { display: flex; gap: 8px; margin: 0; padding: 0; border: 0; min-width: 0; }
fieldset.seg legend { padding: 0; margin-bottom: 6px; }
.seg label { position: relative; flex: 1; }
.seg input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.seg span {
  display: grid;
  place-items: center;
  min-height: 46px;
  padding: 6px 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--bg);
  font-weight: 500;
  text-align: center;
}
.seg input:checked + span {
  background: var(--brand);
  border-color: var(--brand);
  color: var(--brand-ink);
  font-weight: 600;
}
.seg input:focus-visible + span { outline: 3px solid var(--brand); outline-offset: 2px; }
.err { margin: 0; color: var(--danger); font-weight: 600; font-size: 14px; }
.wa {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 54px;
  border-radius: 14px;
  background: var(--wa);
  color: var(--wa-ink);
  font-size: 17px;
  font-weight: 700;
  text-decoration: none;
}
.hint { margin: 0; font-size: 13px; color: var(--muted); text-align: center; }
.linkbtn {
  align-self: center;
  padding: 8px 12px;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 14px;
  text-decoration: underline;
  cursor: pointer;
}
</style>

<div id="app" dir="rtl" lang="ar">
  <header class="head">
    <div class="wrap head__in">
      <div>
        <h1 id="storeName"></h1>
        <p id="tagline"></p>
      </div>
      <span class="price">الأسعار بالدينار الأردني</span>
    </div>
  </header>

  <div class="stick">
    <div class="wrap">
      <label class="sr" for="q">ابحث عن منتج</label>
      <input class="search" id="q" type="search" placeholder="ابحث عن منتج، مثل: حليب" autocomplete="off" enterkeyhint="search">
      <nav class="chips" id="chips" aria-label="الأقسام"></nav>
    </div>
  </div>

  <main class="wrap" id="products"></main>

  <div class="bar" id="bar" hidden>
    <button class="bar__btn" id="openCart" type="button">
      <span class="bar__l"><span class="badge" id="barCount">0</span> عرض السلة</span>
      <span class="price" id="barTotal"></span>
    </button>
  </div>

  <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet__back" id="sheetBack"></div>
    <div class="sheet__panel">
      <div class="sheet__top">
        <h2 id="sheetTitle">سلة المشتريات</h2>
        <button class="x" id="closeCart" type="button" aria-label="إغلاق">×</button>
      </div>
      <ul class="lines" id="lines"></ul>
      <div class="total"><span>المجموع</span><span class="price" id="cartTotal"></span></div>

      <div class="form">
        <div class="field">
          <label class="lbl" for="custName">الاسم</label>
          <input class="in" id="custName" type="text" autocomplete="name" placeholder="اسمك الكريم">
        </div>
        <div class="field">
          <label class="lbl" for="custPhone">رقم الهاتف <em>(اختياري)</em></label>
          <input class="in" id="custPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="07XXXXXXXX" dir="ltr" style="text-align:right">
        </div>
        <fieldset class="seg">
          <legend class="lbl">طريقة الاستلام</legend>
          <label><input type="radio" name="mode" value="delivery" checked><span>توصيل إلى العنوان</span></label>
          <label><input type="radio" name="mode" value="pickup"><span>استلام من المحل</span></label>
        </fieldset>
        <div class="field" id="addrWrap">
          <label class="lbl" for="custAddress">العنوان</label>
          <textarea class="in" id="custAddress" rows="2" autocomplete="street-address" placeholder="المنطقة، الشارع، رقم البناية أو أقرب معلم"></textarea>
        </div>
        <div class="field">
          <label class="lbl" for="custNotes">ملاحظات <em>(اختياري)</em></label>
          <textarea class="in" id="custNotes" rows="2" placeholder="أي تفاصيل تريد إضافتها للطلب"></textarea>
        </div>

        <p class="err" id="err" role="alert" hidden></p>
        <a class="wa" id="waLink" href="#" target="_blank" rel="noopener noreferrer">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9a1.5 1.5 0 0 1-1.5 1.5H10l-4.5 4V16h0A1.5 1.5 0 0 1 4 14.5z"/><path d="M8.5 9h7M8.5 12h4.5"/></svg>
          إرسال الطلب عبر واتساب
        </a>
        <p class="hint">سيفتح واتساب برسالة جاهزة بطلبك. اضغط إرسال هناك لإتمام الطلب.</p>
        <button class="linkbtn" id="clearCart" type="button">تفريغ السلة</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  document.documentElement.lang = 'ar';
  document.documentElement.dir = 'rtl';

  /* ====== إعدادات المتجر: عدّل هنا ====== */
  var CONFIG = {
    storeName: 'ميني ماركت الحقل',
    tagline: 'اختر منتجاتك وأرسل طلبك مباشرة إلى المحل على واتساب',
    whatsapp: '0777436527', // رقم واتساب المحل، مثال: 962791234567 أو 0791234567
    currency: 'د.أ'
  };

  /* ====== المنتجات: [الاسم، الوحدة، السعر بالدينار، الرمز] ====== */
  var CATALOG = [
    { cat: 'المواد التموينية', items: [
      ['أرز تايجر', '3 كغم', 3.15, '🍚'],
      ['سكر شعبان', '9 كغم', 4.85, '🧂'],
      ['سكر الأسرة', '1 كغم', 0.75, '🧂'],
      ['أرز صنبيرد', '900 غم', 1.00, '🍚'],
      ['اندومي أكياس', 'كيس', 0.20, '🍜'],
      ['اندومي كاسات', 'كاسة', 0.35, '🍜'],
      ['صلصة بندورة الدرة', 'بكيت', 0.25, '🍅'],
      ['هريس بندورة الدرة', 'كبير', 1.25, '🍅'],
      ['فول الدرة', 'حبة عريضة', 0.40, '🫘'],
      ['فول الملاح', '', 0.25, '🫘'],
      ['حليب حليبنا', '300 غم', 2.00, '🥛'],
      ['شاي الغزالين حل', '250 غم', 1.75, '🍵'],
      ['شاي الغزالين حل', '500 غم', 3.25, '🍵'],
      ['معكرونة الغزال سباجتي', '', 0.35, '🍝']
    ]},
    { cat: 'المنظفات', items: [] },
    { cat: 'النثريات', items: [] },
    { cat: 'المشروبات والسناكات', items: [] },
    { cat: 'السكاكر', items: [] },
    { cat: 'الهدايا والألعاب', items: [] },
    { cat: 'الأدوات المكتبية', items: [] },
    { cat: 'العناية الشخصية', items: [] }
  ];
  /* ====== نهاية الإعدادات ====== */

  var $ = function (s) { return document.querySelector(s); };
  var store = {
    get: function (k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  var PRODUCTS = [];
  CATALOG.forEach(function (g, gi) {
    g.items.forEach(function (it, ii) {
      PRODUCTS.push({ id: gi + '-' + ii, cat: gi, name: it[0], unit: it[1], cents: Math.round(it[2] * 100), icon: it[3] });
    });
  });
  var byId = {};
  PRODUCTS.forEach(function (p) { byId[p.id] = p; });

  var cart = {};
  var cat = -1;
  var query = '';
  var lastFocus = null;

  var saved = store.get('mm-cart');
  if (saved && typeof saved === 'object') {
    Object.keys(saved).forEach(function (id) {
      var q = parseInt(saved[id], 10);
      if (byId[id] && q > 0) cart[id] = Math.min(q, 99);
    });
  }

  function money(c) { return (c / 100).toFixed(2) + ' ' + CONFIG.currency; }
  function priceHTML(c) { return (c / 100).toFixed(2) + '<small>' + CONFIG.currency + '</small>'; }
  function norm(s) {
    return String(s).toLowerCase()
      .replace(/[ً-ٰٟـ]/g, '')
      .replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي');
  }
  function totals() {
    var count = 0, cents = 0;
    Object.keys(cart).forEach(function (id) { count += cart[id]; cents += cart[id] * byId[id].cents; });
    return { count: count, cents: cents };
  }

  /* ---------- products ---------- */
  function ctlHTML(p) {
    var q = cart[p.id] || 0;
    if (!q) return '<button class="add" type="button" data-act="add" data-id="' + p.id + '">أضف</button>';
    return '<div class="step" role="group" aria-label="الكمية">' +
      '<button type="button" data-act="dec" data-id="' + p.id + '" aria-label="إنقاص الكمية">−</button>' +
      '<output>' + q + '</output>' +
      '<button type="button" data-act="inc" data-id="' + p.id + '" aria-label="زيادة الكمية">+</button></div>';
  }
  function cardHTML(p) {
    return '<article class="card" data-card="' + p.id + '">' +
      '<div class="thumb" aria-hidden="true">' + p.icon + '</div>' +
      '<div class="card__body"><h3>' + p.name + '</h3>' + (p.unit ? '<p class="unit">' + p.unit + '</p>' : '') +
      '<div class="card__foot"><span class="price">' + priceHTML(p.cents) + '</span>' +
      '<div class="ctl">' + ctlHTML(p) + '</div></div></div></article>';
  }
  function renderChips() {
    var html = '<button class="chip" type="button" data-cat="-1" aria-pressed="' + (cat === -1) + '">الكل</button>';
    CATALOG.forEach(function (g, gi) {
      if (!g.items.length) return;
      html += '<button class="chip" type="button" data-cat="' + gi + '" aria-pressed="' + (cat === gi) + '">' + g.cat + '</button>';
    });
    $('#chips').innerHTML = html;
  }
  function renderProducts() {
    var q = norm(query.trim());
    var html = '', any = false;
    CATALOG.forEach(function (g, gi) {
      if (cat !== -1 && cat !== gi) return;
      var list = PRODUCTS.filter(function (p) { return p.cat === gi && (!q || norm(p.name).indexOf(q) !== -1); });
      if (!list.length) return;
      any = true;
      html += '<section class="group"><h2>' + g.cat + '</h2><div class="grid">' + list.map(cardHTML).join('') + '</div></section>';
    });
    $('#products').innerHTML = any ? html : '<p class="empty">لا توجد منتجات مطابقة لبحثك.</p>';
  }
  function updateCard(id, want) {
    var el = document.querySelector('[data-card="' + id + '"] .ctl');
    if (!el) return;
    el.innerHTML = ctlHTML(byId[id]);
    var b = el.querySelector('[data-act="' + want + '"]');
    if (b) b.focus();
  }

  /* ---------- cart ---------- */
  function setQty(id, q) {
    if (q <= 0) delete cart[id]; else cart[id] = Math.min(q, 99);
    store.set('mm-cart', cart);
  }
  function renderBar() {
    var t = totals();
    $('#bar').hidden = t.count === 0;
    $('#barCount').textContent = t.count;
    $('#barTotal').innerHTML = priceHTML(t.cents);
  }
  function stepHTML(p) {
    return '<div class="step" role="group" aria-label="الكمية">' +
      '<button type="button" data-act="dec" data-id="' + p.id + '" aria-label="إنقاص ' + p.name + '">−</button>' +
      '<output>' + cart[p.id] + '</output>' +
      '<button type="button" data-act="inc" data-id="' + p.id + '" aria-label="زيادة ' + p.name + '">+</button></div>';
  }
  function renderCart() {
    var html = '';
    PRODUCTS.forEach(function (p) {
      var q = cart[p.id];
      if (!q) return;
      html += '<li class="line"><span class="line__ico" aria-hidden="true">' + p.icon + '</span>' +
        '<div class="line__info"><strong>' + p.name + '</strong><span>' + (p.unit ? p.unit + ' · ' : '') + money(p.cents) + '</span></div>' +
        '<div class="line__end">' + stepHTML(p) + '<span class="line__sum">' + money(p.cents * q) + '</span></div></li>';
    });
    $('#lines').innerHTML = html;
    $('#cartTotal').innerHTML = priceHTML(totals().cents);
  }
  function refreshAll(id, want) {
    renderBar();
    if (id) updateCard(id, want);
    if (!$('#sheet').hidden) {
      if (!totals().count) closeSheet(); else renderCart();
    }
    refreshLink();
  }

  /* ---------- sheet ---------- */
  function openSheet() {
    if (!totals().count) return;
    lastFocus = document.activeElement;
    renderCart();
    $('#sheet').hidden = false;
    document.body.classList.add('lock');
    refreshLink();
    $('#closeCart').focus();
  }
  function closeSheet() {
    $('#sheet').hidden = true;
    document.body.classList.remove('lock');
    if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch (e) {} }
  }

  /* ---------- order message ---------- */
  function readForm() {
    var mode = document.querySelector('input[name="mode"]:checked');
    return {
      name: $('#custName').value.trim(),
      phone: $('#custPhone').value.trim(),
      mode: mode ? mode.value : 'delivery',
      address: $('#custAddress').value.trim(),
      notes: $('#custNotes').value.trim()
    };
  }
  function buildMessage() {
    var f = readForm(), L = [], n = 0;
    L.push('*طلب جديد من ' + CONFIG.storeName + '*', '');
    L.push('الاسم: ' + (f.name || '-'));
    if (f.phone) L.push('الهاتف: ' + f.phone);
    L.push('الاستلام: ' + (f.mode === 'delivery' ? 'توصيل' : 'استلام من المحل'));
    if (f.mode === 'delivery') L.push('العنوان: ' + (f.address || '-'));
    L.push('', '*الطلب:*');
    PRODUCTS.forEach(function (p) {
      var q = cart[p.id];
      if (!q) return;
      n += 1;
      L.push(n + '. ' + p.name + (p.unit ? ' (' + p.unit + ')' : '') + ' × ' + q + ' = ' + money(p.cents * q));
    });
    L.push('', '*المجموع: ' + money(totals().cents) + '*');
    if (f.notes) L.push('', 'ملاحظات: ' + f.notes);
    return L.join('\n');
  }
  function normPhone(raw) {
    var d = String(raw || '').replace(/\D/g, '');
    if (d.indexOf('00') === 0) d = d.slice(2);
    if (/^07\d{8}$/.test(d)) d = '962' + d.slice(1);
    else if (/^7\d{8}$/.test(d)) d = '962' + d;
    return d.length >= 10 ? d : '';
  }
  function refreshLink() {
    var num = normPhone(CONFIG.whatsapp);
    $('#waLink').href = num ? 'https://wa.me/' + num + '?text=' + encodeURIComponent(buildMessage()) : '#';
  }
  function showErr(msg) {
    var e = $('#err');
    e.textContent = msg || '';
    e.hidden = !msg;
  }
  function validate() {
    var f = readForm();
    ['#custName', '#custAddress'].forEach(function (s) { $(s).removeAttribute('aria-invalid'); });
    if (!totals().count) return { msg: 'السلة فارغة. أضف منتجات أولًا.' };
    if (!f.name) return { msg: 'اكتب اسمك قبل إرسال الطلب.', field: $('#custName') };
    if (f.mode === 'delivery' && !f.address) return { msg: 'اكتب عنوان التوصيل أو اختر الاستلام من المحل.', field: $('#custAddress') };
    if (!normPhone(CONFIG.whatsapp)) return { msg: 'لم يتم ضبط رقم واتساب المتجر بعد.' };
    return null;
  }

  /* ---------- events ---------- */
  $('#products').addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var id = b.getAttribute('data-id'), act = b.getAttribute('data-act'), q = cart[id] || 0;
    if (act === 'add' || act === 'inc') setQty(id, q + 1); else setQty(id, q - 1);
    var now = cart[id] || 0;
    refreshAll(id, now ? (act === 'dec' ? 'dec' : 'inc') : 'add');
  });
  $('#lines').addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var id = b.getAttribute('data-id'), act = b.getAttribute('data-act'), q = cart[id] || 0;
    setQty(id, act === 'inc' ? q + 1 : q - 1);
    renderBar();
    updateCard(id, cart[id] ? 'inc' : 'add');
    if (!totals().count) { closeSheet(); refreshLink(); return; }
    renderCart();
    refreshLink();
    var again = document.querySelector('#lines [data-id="' + id + '"][data-act="' + act + '"]');
    if (again) again.focus();
  });
  $('#chips').addEventListener('click', function (e) {
    var b = e.target.closest('[data-cat]');
    if (!b) return;
    cat = parseInt(b.getAttribute('data-cat'), 10);
    renderChips();
    renderProducts();
    window.scrollTo({ top: 0 });
  });
  $('#q').addEventListener('input', function (e) { query = e.target.value; renderProducts(); });
  $('#openCart').addEventListener('click', openSheet);
  $('#closeCart').addEventListener('click', closeSheet);
  $('#sheetBack').addEventListener('click', closeSheet);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
  $('#clearCart').addEventListener('click', function () {
    cart = {};
    store.set('mm-cart', cart);
    closeSheet();
    renderProducts();
    renderBar();
    refreshLink();
  });

  function syncMode() {
    $('#addrWrap').hidden = readForm().mode !== 'delivery';
  }
  function onForm() {
    syncMode();
    var f = readForm();
    store.set('mm-cust', { name: f.name, phone: f.phone, address: f.address });
    showErr('');
    refreshLink();
  }
  ['#custName', '#custPhone', '#custAddress', '#custNotes'].forEach(function (s) { $(s).addEventListener('input', onForm); });
  document.querySelectorAll('input[name="mode"]').forEach(function (r) { r.addEventListener('change', onForm); });

  $('#waLink').addEventListener('click', function (e) {
    var err = validate();
    if (err) {
      e.preventDefault();
      showErr(err.msg);
      if (err.field) { err.field.setAttribute('aria-invalid', 'true'); err.field.focus(); }
      return;
    }
    showErr('');
    refreshLink();
  });

  /* ---------- init ---------- */
  $('#storeName').textContent = CONFIG.storeName;
  $('#tagline').textContent = CONFIG.tagline;
  var cust = store.get('mm-cust');
  if (cust) {
    $('#custName').value = cust.name || '';
    $('#custPhone').value = cust.phone || '';
    $('#custAddress').value = cust.address || '';
  }
  syncMode();
  renderChips();
  renderProducts();
  renderBar();
  refreshLink();

  window.__mm = { buildMessage: buildMessage, normPhone: normPhone };
})();
</script>

</body></html>
